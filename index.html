<script>
function showErr(m){var a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:20px;color:#ff8f7e;direction:ltr;text-align:left;font-size:13px;word-break:break-word">Error: '+String(m).replace(/</g,'&lt;')+'</div>'}

<style>
:root{
  --bg:#eef4f5; --card:#ffffff; --ink:#10283a; --muted:#5d7282; --line:#dbe6e9;

}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1a22; --card:#14262f; --ink:#e6f0f2; --muted:#91a8b4; --line:#223b47; --pri:#35b9a3; --pri-d:#7fe0cf; --pri-l:#133d38; --warn:#ff8f7e; --warn-l:#3a1f1b}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding-bottom:84px}
button,input,textarea,select{font:inherit;color:inherit}

.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--pri-d);color:#fff;padding:18px 0 22px}

.logo{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--pri-d);display:grid;place-items:center;flex:none}
header h1{margin:0;font-size:1.15rem;font-weight:800;line-height:1.3}
header p{margin:0;font-size:.85rem;opacity:.85}

.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:6px 16px;border-radius:99px;cursor:pointer;font-size:.9rem}

.hero span.go{font-weight:700;font-size:.95rem}

.item{display:block;width:100%;text-align:right;cursor:pointer;background:none;border:0;padding:0}

.tag{background:var(--pri-l);color:var(--pri-d);padding:1px 10px;border-radius:99px;font-weight:500}
.sec{font-size:.95rem;font-weight:800;margin:22px 0 8px}
.article h2{font-size:1.5rem;line-height:1.5;margin:8px 0 12px;font-weight:800}
.article p{margin:0 0 12px;font-size:1.02rem}
.warnbox{background:var(--warn-l);border-right:5px solid var(--warn);border-radius:12px;padding:14px 16px;margin:16px 0}
.warnbox b{color:var(--warn)}
.back{background:none;border:0;color:var(--pri-d);font-weight:700;cursor:pointer;padding:12px 0;font-size:.95rem}
label{display:block;font-size:.88rem;font-weight:700;margin:12px 0 4px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500}
label.chk input{width:auto;margin-top:6px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
textarea{min-height:100px;resize:vertical}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.6}
@media (prefers-color-scheme:dark){.btn{color:#06231f}}
.btn.ghost{background:transparent;color:var(--pri-d);border:1px solid var(--line)}
.btn.del{background:var(--warn-l);color:var(--warn)}
.btn.sm{padding:5px 14px;font-size:.85rem;margin-top:8px}
.linkbtn{background:none;border:0;color:var(--pri-d);text-decoration:underline;cursor:pointer;padding:0}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-child{border-top:0}
.q .who{font-size:.8rem;color:var(--muted)}
.ans{background:var(--pri-l);border-radius:12px;padding:10px 14px;margin-top:8px}
.ans b{color:var(--pri-d);font-size:.85rem}
.pending{font-size:.82rem;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
.setup{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:12px 16px;margin-top:16px;font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .wrap{display:flex;padding:0}
nav button{flex:1;border:0;background:none;padding:10px 4px 8px;cursor:pointer;color:var(--muted);font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--pri-d);font-weight:700}
nav svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;cursor:pointer;font-size:.88rem}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.toast{position:fixed;bottom:96px;inset-inline:16px;max-width:400px;margin:auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;text-align:center;z-index:20;font-size:.9rem}
.foot{font-size:.78rem;color:var(--muted);text-align:center;margin:26px 0 6px}
.loading{text-align:center;color:var(--muted);padding:30px}
.pic{display:block;max-width:100%;max-height:360px;border-radius:12px;margin-top:8px}
.aud{width:100%;margin-top:8px}
.pick{display:inline-block;margin:8px 0 0;cursor:pointer;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.hero{transition:transform .15s}.hero:active{transform:scale(.98)}}
</style>

let fbOK=true,initializeApp,getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,getDocs,onSnapshot,query,where,orderBy,getCountFromServer,increment;

}catch(e){fbOK=false;console.error(e)}

/* ====== ١. لێرە زانیاری Firebase دابنێ ====== */
const firebaseConfig={
  apiKey:"AIzaSyDQb2142ABBylD7pynqrZW_Cb1EyU_EMbo",
  authDomain:"doctor-is-with-you.firebaseapp.com",
  projectId:"doctor-is-with-you",
  appId:"1:818591176540:web:b3e1a6343e169e8c04d399"

/* ====== ٢. ئیمەیلی دکتۆر (بە پیتی بچووک، هەمان ئیمەیلی firestore.rules) ====== */
const DOCTOR_EMAILS=["esmailomarsurchy@gmail.com","bahjatjalal120@gmail.com"];

const CATS=['گەدە','سەرئێشە','سکچوون','سەرماخواردن','پێست','منداڵان','شەکرە و پەستان','ددان','تر'];
const configured=fbOK&&!firebaseConfig.apiKey.startsWith("YOUR_");
let auth,db;
let initErr=null;
if(configured){try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);}catch(e){initErr=e;console.error(e)}}

let posts=[],cfg={doctor:'دکتۆر'},user=null,isDoc=false,ready=false,authReady=false;
let pend={},pendQ={img:''},unsubs=[],ST=null,viewed=new Set();
let Q={post:{},mine:null,all:null};
let V={name:'home',cat:'هەموو',id:null,dtab:'q',query:'',atab:'register'};

/* ---------- یارمەتیدەر ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=s=>esc(s).split(/\n+/).filter(Boolean).map(p=>`<p>${p}</p>`).join('');
const fdate=d=>{try{return new Date(d).toLocaleDateString('ckb-IQ',{day:'numeric',month:'long',year:'numeric'})}catch(e){return new Date(d).toLocaleDateString()}};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)};
const typing=()=>/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
const soft=()=>{if(!typing())render()};
const pendingCount=()=>(Q.all||[]).filter(q=>!q.answered).length;
const errMsg=e=>({
  'auth/invalid-credential':'ئیمەیل یان وشەی نهێنی هەڵەیە','auth/wrong-password':'ئیمەیل یان وشەی نهێنی هەڵەیە',
  'auth/user-not-found':'ئیمەیل یان وشەی نهێنی هەڵەیە','auth/email-already-in-use':'ئەم ئیمەیلە پێشتر بەکارهاتووە',
  'auth/weak-password':'وشەی نهێنی لانیکەم ٨ پیت بێت','auth/invalid-email':'ئیمەیلەکە دروست نییە',
  'auth/too-many-requests':'هەوڵی زۆر درا، دواتر دووبارە هەوڵ بدەرەوە','auth/network-request-failed':'ئینتەرنێت نییە',
  'permission-denied':'ڕێگە پێنەدراوە'}[e?.code]||'هەڵەیەک ڕوویدا، دووبارە هەوڵ بدەرەوە');
async function run(fn){try{await fn()}catch(e){console.error(e);toast(errMsg(e))}}

/* ---------- وێنە و دەنگ ---------- */
const safeImg=s=>typeof s==='string'&&s.startsWith('data:image/')?`<img class="pic" alt="" src="${esc(s)}">`:'';
const safeAud=s=>typeof s==='string'&&s.startsWith('data:audio/')?`<audio class="aud" controls preload="metadata" src="${esc(s)}"></audio>`:'';
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function compress(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;
    im.onload=()=>{
      const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      let q=.7,d=c.toDataURL('image/jpeg',q);
      while(d.length>250000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
      if(d.length>250000){const c2=document.createElement('canvas');c2.width=Math.round(w*.6);c2.height=Math.round(h*.6);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);d=c2.toDataURL('image/jpeg',.5)}
      res(d)};
    im.src=r.result};
  r.readAsDataURL(file)})}
const pendOf=q=>pend[q.id]||(pend[q.id]={audio:q.answerAudio||'',img:q.answerImg||''});
const qById=id=>(Q.all||[]).find(x=>x.id===id)||{id};
function pvHtml(q){const p=pendOf(q);
  return (p.audio?`${safeAud(p.audio)}<button type="button" class="linkbtn" data-rmaud="${q.id}">لابردنی دەنگ</button>`:'')+(p.img?`${safeImg(p.img)}<button type="button" class="linkbtn" data-rmimg="${q.id}">لابردنی وێنە</button>`:'')}
function refreshPv(id){const el=document.getElementById('pv-'+id);if(el)el.innerHTML=pvHtml(qById(id))}
const qpv=()=>pendQ.img?`${safeImg(pendQ.img)}<button type="button" class="linkbtn" data-rmqimg="1">لابردنی وێنە</button>`:'';

let rec=null,rchunks=[],rtimer=null,rqid=null,rt0=0,rmime='';
async function recToggle(qid,btn){
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{
    if(!window.MediaRecorder) throw new Error('no MediaRecorder');
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rmime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const opt={audioBitsPerSecond:24000};if(rmime)opt.mimeType=rmime;
    rec=new MediaRecorder(st,opt);rchunks=[];rqid=qid;rt0=Date.now();
    rec.ondataavailable=e=>{if(e.data&&e.data.size)rchunks.push(e.data)};
    rec.onstop=async()=>{
      clearInterval(rtimer);st.getTracks().forEach(t=>t.stop());
      const b=document.querySelector(`[data-rec="${rqid}"]`);if(b)b.textContent='تۆمارکردنی دەنگ';
      const blob=new Blob(rchunks,{type:rec.mimeType||rmime||'audio/mp4'});
      const d=await blobToData(blob);
      if(d.length>400000){toast('تۆمارەکە زۆر درێژە، کورتتری بکە');return}
      pendOf(qById(rqid)).audio=d;refreshPv(rqid);
    };
    rec.start();
    btn.textContent='وەستان';
    rtimer=setInterval(()=>{const sec=Math.floor((Date.now()-rt0)/1000);const b=document.querySelector(`[data-rec="${rqid}"]`);if(b)b.textContent='وەستان '+sec+'s';if(sec>=90)rec.stop()},500);
  }catch(e){console.error(e);toast('مایکرۆفۆن کار ناکات یان ڕێگەت نەداوە')}
}

/* ---------- خوێندنەوەی داتا ---------- */
async function loadPostQs(id){
  const c=collection(db,'questions');
  const jobs=[getDocs(query(c,where('postId','==',id),where('public','==',true),where('answered','==',true)))];
  if(user) jobs.push(getDocs(query(c,where('postId','==',id),where('uid','==',user.uid))));
  const rs=await Promise.all(jobs),m=new Map();
  rs.forEach(s=>s.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()})));
  Q.post[id]=[...m.values()].sort((a,b)=>b.date-a.date);soft();
}
async function loadMine(){
  if(!user) return;
  const s=await getDocs(query(collection(db,'questions'),where('uid','==',user.uid)));
  Q.mine=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date-a.date);soft();
}
async function loadAll(){
  if(!isDoc) return;
  const s=await getDocs(collection(db,'questions'));
  Q.all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.answered-b.answered)||(b.date-a.date));soft();
}

async function loadStats(){
  if(!isDoc) return;
  const u=collection(db,'users');
  const [a,b,c]=await Promise.all([getCountFromServer(u),getCountFromServer(query(u,where('lastSeen','>',Date.now()-864e5))),getDocs(collection(db,'stats'))]);
  ST={users:a.data().count,active:b.data().count,views:Object.fromEntries(c.docs.map(d=>[d.id,d.data().views||0]))};
  soft();
}

/* ---------- ڕووکارەکان ---------- */
const IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.4A8 8 0 1 1 21 12z"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'
};
function renderNav(){
  const b=(k,i,t)=>`<button class="${(V.name===k||(k==='home'&&V.name==='post'))?'on':''}" data-go="${k}">${IC[i]}<span>${t}</span></button>`;
  document.getElementById('nav').innerHTML=b('home','home','سەرەکی')+b('search','search','گەڕان')+b('mine','chat','پرسیارەکانم')+b('account','user',isDoc?'دکتۆر':'ئەکاونت');
}
const postItem=p=>`<div class="card"><button class="item" data-post="${p.id}"><div class="meta"><span class="tag">${esc(p.cat)}</span><span>${fdate(p.date)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></button></div>`;
const foot=()=>`<p class="foot">ئەم بابەتانە بۆ ڕاگەیاندنن و جێگەی پشکنینی دکتۆر ناگرنەوە. لە حاڵەتی فریاکەوتن بچۆ بۆ نەخۆشخانە.</p>`;

function vHome(){
  let h=configured?'':`<div class="setup">Firebase هێشتا ڕێک نەخراوە (ڕێنمایی ناو چاتەکە ببینە).</div>`;
  const list=V.cat==='هەموو'?posts:posts.filter(p=>p.cat===V.cat);
  const chips=['هەموو',...CATS].map(c=>`<button class="chip ${V.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  h+=`<div class="chips">${chips}</div>`;
  if(!ready&&configured) return h+`<div class="loading">چاوەڕێ بە…</div>`;
  if(!list.length) return h+`<div class="empty">هێشتا بابەت لەم بەشەدا نییە.</div>`;
  const f=list[0];
  h+=`<button class="hero" data-post="${f.id}"><small>${V.cat==='هەموو'?'بابەتی ئەمڕۆ':'نوێترین'} · ${esc(f.cat)}</small><h2>${esc(f.title)}</h2><span class="go">بیخوێنەوە</span></button>`;
  if(list.length>1) h+=`<div class="sec">بابەتەکانی پێشوو</div>`+list.slice(1).map(postItem).join('');
  return h+foot();
}
function qHtml(q,showPost){
  const p=posts.find(x=>x.id===q.postId);
  return `<div class="q"><div class="who">${esc(q.name||'بێناو')} · ${fdate(q.date)} · ${q.public?'بۆ هەمووان':'تایبەت'}${showPost&&p?` · <button class="linkbtn" data-post="${p.id}">${esc(p.title)}</button>`:''}</div>
  <div>${para(q.text)}</div>${safeImg(q.img)}
  ${q.answered?`<div class="ans"><b>وەڵامی ${esc(cfg.doctor)}</b>${q.answer?`<div>${para(q.answer)}</div>`:''}${safeImg(q.answerImg)}${safeAud(q.answerAudio)}</div>`:`<div class="pending">چاوەڕێی وەڵامی دکتۆرە…</div>`}</div>`;
}
function vPost(){
  const p=posts.find(x=>x.id===V.id); if(!p) return '<button class="back" data-go="home">‹ گەڕانەوە</button><div class="empty">ئەم بابەتە نەماوە.</div>';
  const pq=Q.post[p.id];
  const ask=user?`<form class="card" data-form="ask" data-id="${p.id}">
    <label for="qn">ناوت (ئارەزوومەندانە)</label><input id="qn" maxlength="40" autocomplete="off">
    <label for="qt">پرسیارەکەت</label><textarea id="qt" maxlength="600" required></textarea>
    <label class="btn sm ghost pick">زیادکردنی وێنە<input type="file" accept="image/*" id="qimg" hidden></label>
    <div id="qpv">${qpv()}</div>
    <label class="chk"><input type="checkbox" id="qp"><span>ڕێگە بدە پرسیار و وەڵامەکە بۆ هەمووان نیشان بدرێت (بێ ناوی ئیمەیل)</span></label>
    <p class="note">ئەگەر نەتکرد، تەنها تۆ و دکتۆر دەیبینن. ژمارەی مۆبایل و زانیاری تایبەت مەنووسە.</p>
    <button class="btn" type="submit">ناردنی پرسیار</button></form>`
    :`<div class="card"><p style="margin:0 0 4px">بۆ ناردنی پرسیار پێویستە ئەکاونتت هەبێت.</p><button class="btn" data-go="account">چوونە ژوورەوە / دروستکردنی ئەکاونت</button></div>`;
  return `<button class="back" data-go="home">‹ گەڕانەوە</button>
  <article class="article"><div class="meta"><span class="tag">${esc(p.cat)}</span><span>${fdate(p.date)}</span></div>
  <h2>${esc(p.title)}</h2>${para(p.body)}
  ${p.warn?`<div class="warnbox"><b>کەی بچیتە لای دکتۆر؟</b><div>${para(p.warn)}</div></div>`:''}</article>
  <div class="sec">پرسیار لە ${esc(cfg.doctor)} بکە</div>${ask}
  <div class="sec">پرسیار و وەڵامەکان${pq?` (${pq.length})`:''}</div>
  <div class="card">${!pq?'<div class="loading">چاوەڕێ بە…</div>':pq.length?pq.map(q=>qHtml(q)).join(''):'<div class="empty">هێشتا پرسیار نییە.</div>'}</div>`+foot();
}
function vSearch(){
  const q=V.query.trim(), r=q?posts.filter(p=>(p.title+p.body+p.cat).includes(q)):[];
  return `<div style="padding-top:16px"><input id="sq" placeholder="گەڕان: گەدە، سەرئێشە…" value="${esc(V.query)}" autocomplete="off"></div>
  <div style="margin-top:14px">${q?(r.length?r.map(postItem).join(''):'<div class="empty">هیچ بابەتێک نەدۆزرایەوە.</div>'):'<div class="empty">ناوی نەخۆشییەک بنووسە.</div>'}</div>`;
}
function vMine(){
  if(!user) return `<div class="card" style="margin-top:20px"><p style="margin:0">بۆ بینینی پرسیارەکانت بچۆ ژوورەوە.</p><button class="btn" data-go="account">چوونە ژوورەوە</button></div>`;
  const l=Q.mine;
  return `<div class="sec" style="margin-top:20px">پرسیارەکانی تۆ</div><div class="card">${!l?'<div class="loading">چاوەڕێ بە…</div>':l.length?l.map(q=>qHtml(q,true)).join(''):'<div class="empty">هێشتا پرسیارت نەناردووە.</div>'}</div>`;
}
function vAuth(){
  const reg=V.atab==='register';
  return `<div class="card" style="margin-top:20px"><b>بەخێربێیت</b><p class="note" style="font-size:.9rem;margin:4px 0 0">بۆ بینینی بابەتەکان و پرسیارکردن لە دکتۆر، سەرەتا ئەکاونتێک دروست بکە، یان بچۆ ژوورەوە.</p></div>
  <div class="tabs"><button class="${!reg?'on':''}" data-atab="login">چوونە ژوورەوە</button><button class="${reg?'on':''}" data-atab="register">ئەکاونتی نوێ</button></div>
  <form class="card" data-form="auth"><label for="em">ئیمەیل</label><input id="em" type="email" autocomplete="email" required>
  <label for="pw">وشەی نهێنی</label><input id="pw" type="password" minlength="8" autocomplete="${reg?'new-password':'current-password'}" required>
  ${reg?'<p class="note">لانیکەم ٨ پیت.</p>':''}
  <button class="btn" type="submit">${reg?'دروستکردنی ئەکاونت':'چوونە ژوورەوە'}</button>
  ${reg?'':'<p class="note"><button type="button" class="linkbtn" data-act="reset">وشەی نهێنیم لەبیرچووە</button></p>'}</form>`;
}
function vStats(tabs){
  if(!ST||!Q.all) return tabs+'<div class="loading">چاوەڕێ بە…</div>';
  const qc={};Q.all.forEach(q=>{qc[q.postId]=(qc[q.postId]||0)+1});
  const rows=posts.map(p=>({t:p.title,v:ST.views[p.id]||0,q:qc[p.id]||0}));
  const list=(k)=>rows.filter(r=>r[k]>0).sort((a,b)=>b[k]-a[k]).slice(0,10).map(r=>`<div class="q" style="display:flex;justify-content:space-between;gap:10px"><span>${esc(r.t)}</span><b>${r[k]}</b></div>`).join('')||'<div class="empty">هێشتا داتا نییە.</div>';
  const box=(n,l)=>`<div class="card" style="flex:1;margin:0;text-align:center"><div style="font-size:1.6rem;font-weight:800;color:var(--pri-d)">${n}</div><div class="note" style="margin:0">${l}</div></div>`;
  return tabs+`<div style="display:flex;gap:10px;margin-bottom:10px">${box(ST.users,'ئەکاونت')}${box(ST.active,'چالاک لە ٢٤ کاتژمێر')}</div>
  <div style="display:flex;gap:10px">${box(Q.all.length,'کۆی پرسیار')}${box(pendingCount(),'بێ وەڵام')}</div>
  <div class="sec">زۆرترین کلیک لەسەر بابەت</div><div class="card">${list('v')}</div>
  <div class="sec">زۆرترین پرسیار لەسەر بابەت</div><div class="card">${list('q')}</div>
  <p class="note">ئەکاونتە کۆنەکان کاتێک دەژمێردرێن کە جارێکی تر بچنە ژوورەوە.</p>`;
}
function vAccount(){
  if(!configured) return `<div class="setup">Firebase هێشتا ڕێک نەخراوە.</div>`;
  if(!user) return vAuth();
  if(!isDoc) return `<div class="card" style="margin-top:20px"><b>ئەکاونتەکەت</b><p class="note" style="font-size:.9rem">${esc(user.email)}</p><button class="btn ghost" data-act="logout">دەرچوون</button></div>`;
  const n=pendingCount();
  const tabs=`<div class="tabs"><button class="${V.dtab==='q'?'on':''}" data-dtab="q">پرسیارەکان${n?` (${n})`:''}</button><button class="${V.dtab==='new'?'on':''}" data-dtab="new">بابەتی نوێ</button><button class="${V.dtab==='stats'?'on':''}" data-dtab="stats">ئامار</button><button class="${V.dtab==='set'?'on':''}" data-dtab="set">ڕێکخستن</button></div>`;
  if(V.dtab==='stats') return vStats(tabs);
  if(V.dtab==='new') return tabs+`<form class="card" data-form="post">
    <label for="pc">بەش</label><select id="pc">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <label for="pt">ناونیشان</label><input id="pt" maxlength="120" required>
    <label for="pb">بابەتەکە</label><textarea id="pb" style="min-height:180px" required></textarea>
    <label for="pw2">کەی بچنە لای دکتۆر؟ (ئارەزوومەندانە)</label><textarea id="pw2"></textarea>
    <button class="btn" type="submit">بڵاوکردنەوە</button></form>
    <div class="sec">بابەتە بڵاوکراوەکان</div>`+posts.map(p=>`<div class="card"><div class="meta"><span class="tag">${esc(p.cat)}</span><span>${fdate(p.date)}</span></div><b>${esc(p.title)}</b><br><button class="btn sm del" data-delpost="${p.id}">سڕینەوە</button></div>`).join('');
  if(V.dtab==='set') return tabs+`<form class="card" data-form="cfg"><label for="dn">ناوی دکتۆر (وەک ‹د. ئەحمەد›)</label><input id="dn" value="${esc(cfg.doctor)}" maxlength="40"><button class="btn" type="submit">پاشەکەوتکردن</button></form>
    <button class="btn ghost" data-act="logout">دەرچوون</button>`;
  const l=Q.all;
  if(!l) return tabs+'<div class="loading">چاوەڕێ بە…</div>';
  return tabs+(l.length?l.map(q=>{const p=posts.find(x=>x.id===q.postId);
    return `<div class="card"><div class="note" style="margin:0">${p?esc(p.title):'بابەتی سڕاوە'}</div>${qHtml(q)}
    <form data-form="answer" data-id="${q.id}"><textarea placeholder="وەڵامەکەت…">${esc(q.answer||'')}</textarea>
    <div id="pv-${q.id}">${pvHtml(q)}</div>
    <button class="btn sm ghost" type="button" data-rec="${q.id}">تۆمارکردنی دەنگ</button> <label class="btn sm ghost pick">زیادکردنی وێنە<input type="file" accept="image/*" data-aimg="${q.id}" hidden></label><br>
    <button class="btn sm" type="submit">${q.answered?'نوێکردنەوەی وەڵام':'ناردنی وەڵام'}</button>
    ${q.answered?`<button class="btn sm ghost" type="button" data-pub="${q.id}">${q.public?'شاردنەوە لە هەمووان':'نیشاندان بۆ هەمووان'}</button>`:''}
    <button class="btn sm del" type="button" data-delq="${q.id}">سڕینەوە</button></form></div>`}).join(''):'<div class="empty">هێشتا هیچ پرسیارێک نەهاتووە.</div>');
}
function render(){
  document.getElementById('hname').textContent='دکتۆر لەگەڵتە';
  const map={home:vHome,post:vPost,search:vSearch,mine:vMine,account:vAccount};
  const gated=configured&&!user;
  document.getElementById('app').innerHTML=(configured&&!authReady)?'<div class="loading">چاوەڕێ بە…</div>':gated?vAuth():map[V.name]();
  document.querySelector('nav').style.display=gated?'none':'';
  if(!gated) renderNav();
}
function go(o){
  if(o.name==='post'&&o.id!==V.id) pendQ.img='';
  V={...V,...o};render();window.scrollTo(0,0);
  if(!configured) return;
  if(V.name==='post'&&V.id){loadPostQs(V.id);if(!isDoc&&!viewed.has(V.id)){viewed.add(V.id);setDoc(doc(db,'stats',V.id),{views:increment(1)},{merge:true}).catch(console.error)}}
  if(V.name==='mine') loadMine();
  if(V.name==='account'&&isDoc){loadAll();if(V.dtab==='stats') loadStats()}
}

/* ---------- ڕووداوەکان ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-cat],[data-post],[data-dtab],[data-atab],[data-delpost],[data-delq],[data-pub],[data-act],[data-rec],[data-rmaud],[data-rmimg],[data-rmqimg]'); if(!t) return;
  e.preventDefault();
  const d=t.dataset;
  if(d.go) return go({name:d.go});
  if(d.cat) return go({cat:d.cat});
  if(d.post) return go({name:'post',id:d.post});
  if(d.atab) return go({atab:d.atab});
  if(d.dtab){V.dtab=d.dtab;return go({});}
  if(d.act==='logout') return run(()=>signOut(auth));
  if(d.act==='reset'){
    const em=document.getElementById('em').value.trim();
    if(!em) return toast('سەرەتا ئیمەیلەکەت بنووسە');
    return run(async()=>{await sendPasswordResetEmail(auth,em);toast('بەستەرێک بۆ ئیمەیلەکەت نێردرا')});
  }
  if(d.rmqimg){pendQ.img='';const el=document.getElementById('qpv');if(el)el.innerHTML=qpv();return}
  if(!isDoc) return;
  if(d.rec) return recToggle(d.rec,t);
  if(d.rmaud){pendOf(qById(d.rmaud)).audio='';return refreshPv(d.rmaud)}
  if(d.rmimg){pendOf(qById(d.rmimg)).img='';return refreshPv(d.rmimg)}
  if(d.delpost&&confirm('ئەم بابەتە بسڕدرێتەوە؟')) run(async()=>{await deleteDoc(doc(db,'posts',d.delpost));toast('سڕایەوە')});
  if(d.delq&&confirm('ئەم پرسیارە بسڕدرێتەوە؟')) run(async()=>{await deleteDoc(doc(db,'questions',d.delq));await loadAll()});
  if(d.pub) run(async()=>{const q=Q.all.find(x=>x.id===d.pub);await updateDoc(doc(db,'questions',d.pub),{public:!q.public});await loadAll()});
});
document.addEventListener('input',e=>{
  if(e.target.id==='sq'){V.query=e.target.value;const pos=e.target.selectionStart;
    document.getElementById('app').innerHTML=vSearch();const i=document.getElementById('sq');i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener('change',async e=>{
  const t=e.target,f=t.files&&t.files[0]; if(!f) return;
  try{
    if(t.id==='qimg'){pendQ.img=await compress(f);const el=document.getElementById('qpv');if(el)el.innerHTML=qpv()}
    else if(t.dataset.aimg&&isDoc){pendOf(qById(t.dataset.aimg)).img=await compress(f);refreshPv(t.dataset.aimg)}
  }catch(x){console.error(x);toast('وێنەکە ناخوێنرێتەوە')}
  t.value='';
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form'); if(!f||!f.dataset.form) return; e.preventDefault();
  if(!configured) return toast('Firebase ڕێک نەخراوە');
  const k=f.dataset.form, $=s=>f.querySelector(s), btn=$('button[type=submit]');
  const busy=async fn=>{if(btn)btn.disabled=true;await run(fn);if(btn)btn.disabled=false};
  if(k==='auth') busy(async()=>{
    const em=$('#em').value.trim(),pw=$('#pw').value;
    if(V.atab==='register') await createUserWithEmailAndPassword(auth,em,pw);
    else await signInWithEmailAndPassword(auth,em,pw);
  });
  if(k==='ask') busy(async()=>{
    const text=$('#qt').value.trim(); if(!text||!user) return;
    await addDoc(collection(db,'questions'),{uid:user.uid,postId:f.dataset.id,name:$('#qn').value.trim().slice(0,40),text:text.slice(0,600),img:pendQ.img||'',answer:'',answerImg:'',answerAudio:'',answered:false,public:$('#qp').checked,date:Date.now()});
    pendQ.img='';toast('پرسیارەکەت نێردرا');$('#qt').value='';await loadPostQs(f.dataset.id);Q.mine=null;
  });
  if(k==='post'&&isDoc) busy(async()=>{
    await addDoc(collection(db,'posts'),{cat:$('#pc').value,title:$('#pt').value.trim(),body:$('#pb').value.trim(),warn:$('#pw2').value.trim(),date:Date.now()});
    toast('بڵاوکرایەوە');V.dtab='q';go({name:'home',cat:'هەموو'});
  });
  if(k==='answer'&&isDoc) busy(async()=>{
    const id=f.dataset.id,text=f.querySelector('textarea').value.trim(),pd=pend[id]||{audio:'',img:''};
    if(!text&&!pd.audio&&!pd.img) return toast('وەڵامێک بنووسە، یان دەنگ/وێنە زیاد بکە');
    await updateDoc(doc(db,'questions',id),{answer:text,answerImg:pd.img||'',answerAudio:pd.audio||'',answered:true});
    delete pend[id];toast('وەڵام نێردرا');await loadAll();
  });
  if(k==='cfg'&&isDoc) busy(async()=>{
    const n=$('#dn').value.trim()||'دکتۆر';
    await setDoc(doc(db,'config','app'),{doctor:n});toast('پاشەکەوت کرا');
  });
});

/* ---------- دەستپێکردن ---------- */
if(configured&&!initErr){
  onAuthStateChanged(auth,u=>{
    user=u;authReady=true;isDoc=!!u&&DOCTOR_EMAILS.includes((u.email||'').toLowerCase());
    unsubs.forEach(f=>f());unsubs=[];posts=[];ready=false;Q={post:{},mine:null,all:null};
    if(u){
      setDoc(doc(db,'users',u.uid),{createdAt:Date.parse(u.metadata&&u.metadata.creationTime)||Date.now(),lastSeen:Date.now()},{merge:true}).catch(console.error);
      unsubs.push(onSnapshot(query(collection(db,'posts'),orderBy('date','desc')),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;soft()},e=>{console.error(e);ready=true;soft()}));
      unsubs.push(onSnapshot(doc(db,'config','app'),s=>{if(s.exists()&&s.data().doctor)cfg.doctor=s.data().doctor;soft()},e=>console.error(e)));
      if(V.name==='post'&&V.id) loadPostQs(V.id);
      if(V.name==='mine') loadMine();
      if(isDoc) loadAll();
    }else V={...V,name:'home'};
    render();
  });
}
render();
if(initErr) showErr(initErr.message||initErr);
</script>
</body>
</html>
